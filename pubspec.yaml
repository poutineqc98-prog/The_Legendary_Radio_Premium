name: the_legendary_radio
description: THE LEGENDARY RADIO — Final Premium Edition. Lecteur musical Android haut de gamme connecte a Plex avec Monsieur Chat et support Nothing Glyph.
publish_to: 'none'
version: 4.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  just_audio: ^0.9.38
  audio_service: ^0.18.13
  audio_session: ^0.1.19
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  palette_generator: ^0.3.3+4
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  flutter_tts: ^4.0.2
  geolocator: ^12.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
